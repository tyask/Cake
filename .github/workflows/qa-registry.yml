name: QA registry
run-name: Cake QA ${{ inputs.action || 'release' }} ${{ inputs.request_id || github.event.pull_request.number }}

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      action:
        description: QA registry action
        required: true
        type: choice
        options: [initialize, reserve, status, begin, register, publish, release]
      request_id:
        description: Unique request UUID
        required: true
        type: string
      pr_number:
        description: Same-repository PR number
        required: false
        type: string
      lease_id:
        description: Current lease UUID
        required: false
        type: string
      source_sha:
        description: Exact current PR head SHA
        required: false
        type: string
      phase:
        description: Deployment phase
        required: false
        type: choice
        options: [provisioning, application]
      attempt_id:
        description: Deployment creation attempt UUID
        required: false
        type: string
      deployment_id:
        description: Exact Deployment ID
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  deployments: read

jobs:
  registry:
    if: >-
      github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main' &&
      vars.CAKE_CANNELE_ENABLED != 'true' &&
      (vars.CAKE_QA_REGISTRY_ENABLED == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'initialize')) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main' &&
        startsWith(github.event.pull_request.head.ref, 'codex/')))
    uses: ./.github/workflows/qa-registry-run.yml
    with:
      action: ${{ inputs.action }}
      request_id: ${{ inputs.request_id }}
      pr_number: ${{ inputs.pr_number }}
      lease_id: ${{ inputs.lease_id }}
      source_sha: ${{ inputs.source_sha }}
      phase: ${{ inputs.phase }}
      attempt_id: ${{ inputs.attempt_id }}
      deployment_id: ${{ inputs.deployment_id }}
    secrets:
      production_database_host: ${{ vars.CAKE_QA_PRODUCTION_DATABASE_HOST }}
      registry_database_url: ${{ secrets.CAKE_QA_REGISTRY_DATABASE_URL }}
      registry_database_host: ${{ secrets.CAKE_QA_REGISTRY_DATABASE_HOST }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
