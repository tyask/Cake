name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cannele_test
          POSTGRES_PASSWORD: cannele_test
          POSTGRES_DB: cannele_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cannele_test -d cannele_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAKE_REGISTRY_FENCE_TEST_DATABASE_URL: postgresql://cannele_test:cannele_test@127.0.0.1:5432/cannele_test
      CAKE_REGISTRY_FENCE_REQUIRE_DATABASE_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep the test runtime reproducible. Node 24.21.0 intermittently
          # aborts during PGlite/WASM tests on the hosted runner.
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
