name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep the Playwright version aligned with package-lock.json; update the digest with the tag.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --user 1001:1001
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep the test runtime reproducible. Node 24.21.0 intermittently
          # aborts during PGlite/WASM tests on the hosted runner.
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check Node.js version
        run: npm run check:node

      - name: Install dependencies
        run: npm ci

      - name: Fast checks
        run: npm run check:fast

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cloud browser tests with disposable in-memory database
        run: npm run qa:cloud

      - name: Upload Cloud browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-browser-${{ github.sha }}
          path: .cake/cloud/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
