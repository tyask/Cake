name: Cake Post Merge
run-name: Post Merge PR ${{ inputs.pr || github.event.pull_request.number }}
on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged Cake PR number to verify again
        type: string
        required: true
permissions: {}
concurrency:
  group: cake-post-merge-pr-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'codex/')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    outputs:
      issue: ${{ steps.verify.outputs.issue }}
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Verify merge, deployments, CI and cleanup
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node --import tsx scripts/task/post-merge-workflow.ts verify
      - name: Save public verification result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-merge-result.json
          if-no-files-found: ignore
          retention-days: 30
  publish:
    needs: verify
    if: always() && needs.verify.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cake-post-merge-issue-${{ needs.verify.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Read this run's public result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: post-merge-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Update the linked Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/task/post-merge-workflow.ts publish
