name: Cake Post Merge
run-name: Post Merge ${{ inputs.pr || github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged Cake PR number to verify again
        type: string
        required: true
permissions: {}
concurrency:
  group: cake-post-merge-${{ inputs.pr || github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.prepare.outputs.targets }}
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Resolve merged PRs from the trusted event
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/task/post-merge-workflow.ts prepare
  verify:
    needs: prepare
    if: needs.prepare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-latest
    environment: cake-automation
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Verify merge, deployments, CI and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          CAKE_POST_MERGE_PR: ${{ matrix.target.pr }}
          CAKE_POST_MERGE_ISSUE: ${{ matrix.target.issue }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node --import tsx scripts/task/post-merge-workflow.ts verify
      - name: Save public verification result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-merge-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target.pr }}
          path: post-merge-result.json
          if-no-files-found: ignore
          retention-days: 30
  publish:
    needs: [prepare, verify]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cake-post-merge-issue-${{ matrix.target.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Read this PR's public result from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: post-merge-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target.pr }}
      - name: Update the linked Issue
        env:
          GH_TOKEN: ${{ github.token }}
          CAKE_POST_MERGE_PR: ${{ matrix.target.pr }}
          CAKE_POST_MERGE_ISSUE: ${{ matrix.target.issue }}
        run: node --import tsx scripts/task/post-merge-workflow.ts publish
