name: Cake Main Preview
run-name: Main Preview ${{ github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: cake-main-preview
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # Fast-forward only the reserved mirror; never update main.
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install official Chromium
        run: npx playwright install --with-deps chromium
      - name: Deploy and verify persistent Preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node --import tsx scripts/staging-workflow.ts
