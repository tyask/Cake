name: Read-only Cannele readiness runner

on:
  workflow_call:
    inputs:
      reviewed_revision:
        required: true
        type: string
      request_id:
        required: true
        type: string
    secrets:
      production_database_host:
        required: false
      registry_database_url:
        required: false
      registry_database_host:
        required: false
      VERCEL_TOKEN:
        required: false
      NEON_API_KEY:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'tyask/Cake' &&
      github.ref == 'refs/heads/main' && github.actor == github.repository_owner &&
      github.run_attempt == '1' && inputs.reviewed_revision == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No GitHub environment: vars below use repository context, without Preview
    # overrides. This job performs no reservation, DDL, transition or deployment.
    concurrency:
      group: cake-cannele-readiness
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout exact reviewed main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyask/Cake
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Validate public inspection identifiers
        run: |
          node --input-type=module <<'CANNELE_READINESS_INPUT_JS'
          const revision = process.env.CANNELE_READINESS_EXPECTED_REVISION;
          const requestId = process.env.CANNELE_READINESS_REQUEST_ID;
          if (!/^[a-f0-9]{40}$/.test(revision ?? '') || revision !== process.env.GITHUB_SHA ||
              !/^[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/.test(requestId ?? '')) {
            throw new Error('Readiness inspection identifiers are invalid.');
          }
          CANNELE_READINESS_INPUT_JS
        env:
          CANNELE_READINESS_EXPECTED_REVISION: ${{ inputs.reviewed_revision }}
          CANNELE_READINESS_REQUEST_ID: ${{ inputs.request_id }}
      - name: Install reviewed dependencies without administrative credentials
        run: npm ci
      - name: Inspect existing QA registry and provider metadata
        run: |
          export QA_TRUSTED_MAIN_SHA="$(git rev-parse HEAD)"
          node --import tsx scripts/cannele-readiness.ts
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          CANNELE_READINESS_EXPECTED_REVISION: ${{ inputs.reviewed_revision }}
          CANNELE_READINESS_REQUEST_ID: ${{ inputs.request_id }}
          CANNELE_READINESS_RESULT_PATH: ${{ runner.temp }}/cannele-readiness/${{ inputs.request_id }}/result.json
          CAKE_CANNELE_ENABLED: ${{ vars.CAKE_CANNELE_ENABLED }}
          CAKE_QA_POOL_ENABLED: ${{ vars.CAKE_QA_POOL_ENABLED }}
          CAKE_QA_REGISTRY_ENABLED: ${{ vars.CAKE_QA_REGISTRY_ENABLED }}
          CAKE_QA_PARENT_BRANCH_ID: ${{ vars.CAKE_QA_PARENT_BRANCH_ID }}
          CAKE_QA_PRODUCTION_DATABASE_HOST: ${{ secrets.production_database_host }}
          CAKE_QA_REGISTRY_DATABASE_URL: ${{ secrets.registry_database_url }}
          CAKE_QA_REGISTRY_DATABASE_HOST: ${{ secrets.registry_database_host }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      - name: Upload strict public readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cannele-readiness-${{ inputs.request_id }}
          path: ${{ runner.temp }}/cannele-readiness/${{ inputs.request_id }}/result.json
          if-no-files-found: error
          retention-days: 1
