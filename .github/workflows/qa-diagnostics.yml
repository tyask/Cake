name: QA diagnostics (read only)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only inspection or informational plan
        required: true
        type: choice
        options: [preflight, plan-probe, plan-release]
        default: preflight
      pr_number:
        description: Target PR number (plan only)
        required: false
        type: string
      source_sha:
        description: Current full PR SHA (plan-probe)
        required: false
        type: string
      slot:
        description: Exact proposed slot (plan-probe)
        required: false
        type: choice
        options: [qa1, qa2, qa3]
      lease_id:
        description: Current lease UUID (plan-release)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  deployments: read

jobs:
  inspect:
    if: github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies without API credentials
        run: npm ci
      - name: Inspect without mutations
        run: node --import tsx scripts/qa-bootstrap.ts
        env:
          QA_BOOTSTRAP_ACTION: ${{ inputs.action }}
          QA_BOOTSTRAP_PR_NUMBER: ${{ inputs.pr_number }}
          QA_BOOTSTRAP_SOURCE_SHA: ${{ inputs.source_sha }}
          QA_BOOTSTRAP_SLOT: ${{ inputs.slot }}
          QA_BOOTSTRAP_LEASE_ID: ${{ inputs.lease_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CAKE_QA_PARENT_BRANCH_ID: ${{ vars.CAKE_QA_PARENT_BRANCH_ID }}
          CAKE_QA_PRODUCTION_DATABASE_HOST: ${{ vars.CAKE_QA_PRODUCTION_DATABASE_HOST }}
