name: Cake Preview
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Preview {0} PR {1} {2}', inputs.action, inputs.pr, inputs.operation) ||
      github.event_name == 'push' && format('Preview cleanup main {0} {1}', github.sha, github.run_id) ||
      format('Preview request {0} {1}', github.event.workflow_run.head_branch, github.run_id) }}
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [deploy, status, cleanup, verify]
      pr:
        type: string
        required: true
      sha:
        type: string
        required: true
      controlSha:
        description: Exact trusted main SHA verified by the caller before dispatch
        type: string
        required: true
      operation:
        description: UUID identifying this exact request; rerun the same run after an uncertain response
        type: string
        required: true
      deploymentId:
        description: Exact existing READY application Deployment ID (required for verify only)
        type: string
        required: false
  push:
    branches: [main]
  workflow_run:
    workflows: [Cake PR Events]
    types: [completed]
permissions: {}
jobs:
  prepare:
    if: >-
      github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.action != 'verify') ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'codex/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      targets: ${{ steps.prepare.outputs.targets }}
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Resolve PRs without provider credentials
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/preview/preview-workflow.ts --prepare
  preview:
    needs: prepare
    if: >-
      github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.prepare.outputs.targets) }}
    name: ${{ github.event_name == 'push' && format('preview-cleanup-{0}', matrix.pr) || 'preview' }}
    concurrency:
      group: cake-preview-${{ matrix.pr }}
      cancel-in-progress: false
    environment: cake-automation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check Node.js version
        run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Run the requested operation
        env:
          CAKE_PREVIEW_PR: ${{ matrix.pr }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node --import tsx scripts/preview/preview-workflow.ts
      - name: Publish public operation receipt notice
        if: success() || (always() && github.event_name == 'push')
        run: node --import tsx scripts/preview/preview-workflow.ts --notice
  preview-verify:
    if: >-
      github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    concurrency:
      group: cake-preview-${{ inputs.pr }}
      cancel-in-progress: false
    environment: cake-automation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Keep the Playwright version aligned with package-lock.json; update the digest with the tag.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --user 1001:1001
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check Node.js version
        run: npm run check:node
      - run: npm ci --ignore-scripts
      - name: Run the requested operation
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node --import tsx scripts/preview/preview-workflow.ts
      - name: Publish public operation receipt notice
        if: success() || (always() && github.event_name == 'workflow_dispatch' && inputs.action == 'verify')
        run: node --import tsx scripts/preview/preview-workflow.ts --notice
