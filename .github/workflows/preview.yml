# Isolated notice transport test for codex/checks-receipt-probe only.
# Do not merge this workflow variant into main.
name: Cake Checks Notice Probe
run-name: Checks notice probe ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: [deploy, status, cleanup]
      pr:
        description: Must be 0 for this isolated transport probe
        required: true
        type: string
      sha:
        description: Exact SHA of the reviewed isolated test branch
        required: true
        type: string
      operation:
        description: Fresh UUID v4 for this transport test only
        required: true
        type: string
permissions: {}
jobs:
  operation:
    if: >-
      github.repository == 'tyask/Cake' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/checks-receipt-probe' &&
      github.sha == inputs.sha && inputs.action == 'status' && inputs.pr == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Emit one non-secret receipt as a standard notice annotation
        env:
          PROBE_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          python3 - <<'PYNOTICE'
          import datetime, json, os, uuid
          operation = os.environ['PROBE_OPERATION']
          assert str(uuid.UUID(operation, version=4)) == operation
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          receipt = {'protocol':'cake-checks-notice-probe/v1','probeOnly':True,
              'repository':'tyask/Cake','runId':int(os.environ['GITHUB_RUN_ID']),
              'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'controlSha':os.environ['GITHUB_SHA'],'operation':operation,
              'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'message':'日本語を含む非機密の往復試験'}
          text = json.dumps(receipt,ensure_ascii=False,separators=(',',':'))
          assert len(text.encode()) <= 4096
          escaped = text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Cake public receipt v1::' + escaped)
          PYNOTICE
