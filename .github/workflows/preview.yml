name: Cake Preview
run-name: Preview ${{ inputs.action || 'cleanup' }} PR ${{ inputs.pr || github.event.pull_request.number }} ${{ inputs.operation || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [deploy, status, cleanup, verify]
      pr:
        type: string
        required: true
      sha:
        type: string
        required: true
      controlSha:
        description: Exact trusted main SHA verified by the caller before dispatch
        type: string
        required: true
      operation:
        description: UUID identifying this exact request; rerun the same run after an uncertain response
        type: string
        required: true
      deploymentId:
        description: Exact existing READY application Deployment ID (required for verify only)
        type: string
        required: false
  pull_request_target:
    branches: [main]
    types: [closed]
permissions: {}
concurrency:
  group: cake-preview-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'tyask/Cake' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'codex/')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the official Playwright browser for verification
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
        run: npx playwright install --with-deps chromium
      - name: Run the requested operation
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node --import tsx scripts/preview-workflow.ts
      - name: Publish public operation receipt notice
        if: success() || (always() && github.event_name == 'workflow_dispatch' && inputs.action == 'verify')
        run: node --import tsx scripts/preview-workflow.ts --notice
